<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>下坝村茄子基地 - 专属气象站</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", Roboto, sans-serif;
            /* 柔和渐变背景，衬托毛玻璃效果 */
            background: linear-gradient(145deg, #e0f2fe 0%, #f0fdf4 35%, #f1f5f9 70%, #e2e8f0 100%);
            background-attachment: fixed;
            color: #0f172a;
            margin: 0;
            padding: 14px;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* 顶部导航 */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 6px 2px 14px;
        }
        .header h1 {
            font-size: 21px;
            font-weight: 800;
            margin: 0;
            color: #0f172a;
            display: flex;
            align-items: center;
            gap: 6px;
            text-shadow: 0 1px 2px rgba(255,255,255,0.8);
        }
        .refresh-btn {
            background: rgba(2, 132, 199, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.2);
            display: flex;
            align-items: center;
            gap: 4px;
            transition: all 0.2s ease;
        }
        .refresh-btn:active {
            background: #0284c7;
            transform: scale(0.96);
        }

        /* 毛玻璃卡片核心样式 */
        .card {
            background: rgba(255, 255, 255, 0.72);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 18px;
            padding: 16px;
            margin-bottom: 14px;
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 6px 20px rgba(15, 23, 42, 0.05);
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 15px;
            font-weight: 700;
            color: #334155;
            border-bottom: 1px solid rgba(226, 232, 240, 0.6);
            padding-bottom: 8px;
            margin-bottom: 12px;
        }

        /* 雷达卡片 (毛玻璃主题状态) */
        .alert-safe {
            background: rgba(240, 253, 244, 0.78);
            border: 1.5px solid rgba(34, 197, 94, 0.6);
        }
        .alert-safe .radar-title { color: #166534; }
        .alert-safe .radar-summary { color: #15803d; }
        
        .alert-rain {
            background: rgba(254, 242, 242, 0.82);
            border: 1.5px solid rgba(239, 68, 68, 0.6);
        }
        .alert-rain .radar-title { color: #991b1b; }
        .alert-rain .radar-summary { color: #b91c1c; }

        .radar-summary {
            font-size: 22px;
            font-weight: 800;
            margin: 6px 0 2px;
            line-height: 1.35;
        }

        /* 实时天气 */
        .temp-row {
            display: flex;
            align-items: baseline;
            gap: 10px;
            margin: 4px 0 8px;
        }
        .now-temp-num {
            font-size: 38px;
            font-weight: 900;
            color: #0f172a;
            letter-spacing: -0.5px;
        }
        .now-weather-text {
            font-size: 20px;
            font-weight: 700;
            color: #0284c7;
        }
        .meta-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px 14px;
            margin-top: 10px;
            background: rgba(248, 250, 252, 0.65);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 10px 12px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.6);
        }
        .meta-item {
            font-size: 15px;
            color: #475569;
            font-weight: 600;
        }
        .meta-item b { color: #0f172a; }

        /* 苹果天气风格横向滑动卡片 */
        .hourly-scroll-wrap {
            overflow-x: auto;
            overflow-y: hidden;
            -webkit-overflow-scrolling: touch;
            scroll-snap-type: x mandatory;
            display: flex;
            gap: 10px;
            padding: 4px 2px 8px;
            margin: 0 -4px;
        }
        .hourly-scroll-wrap::-webkit-scrollbar {
            height: 4px;
        }
        .hourly-scroll-wrap::-webkit-scrollbar-thumb {
            background: rgba(203, 213, 225, 0.8);
            border-radius: 4px;
        }
        .hourly-item {
            flex: 0 0 74px;
            scroll-snap-align: start;
            background: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1.5px solid rgba(255, 255, 255, 0.8);
            border-radius: 14px;
            padding: 10px 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            text-align: center;
            min-height: 124px;
            cursor: pointer;
            transition: all 0.15s ease;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        }
        .hourly-item:active {
            transform: scale(0.96);
        }
        .hourly-item.is-rain {
            background: rgba(224, 242, 254, 0.65);
            border-color: rgba(56, 189, 248, 0.6);
        }
        .hourly-item.selected {
            border-color: #0284c7;
            background: rgba(186, 230, 253, 0.85);
            box-shadow: 0 0 0 2px rgba(2, 132, 199, 0.3);
        }
        .hourly-time {
            font-size: 14px;
            font-weight: 700;
            color: #64748b;
        }
        .hourly-icon-text {
            font-size: 15px;
            font-weight: 800;
            color: #0f172a;
            margin: 3px 0;
        }
        .hourly-precip {
            font-size: 13px;
            font-weight: 700;
            color: #0284c7;
            height: 18px;
            line-height: 18px;
        }
        .hourly-precip.none {
            color: #cbd5e1;
            font-weight: 400;
        }
        .hourly-temp {
            font-size: 18px;
            font-weight: 800;
            color: #0f172a;
            margin-top: 4px;
        }

        /* 选中小时详细说明卡片 (Master-Detail) */
        .hourly-detail-box {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 14px;
            padding: 12px 14px;
            margin-top: 12px;
            border-left: 4px solid #0284c7;
            border-top: 1px solid rgba(255, 255, 255, 0.8);
            border-right: 1px solid rgba(255, 255, 255, 0.8);
            border-bottom: 1px solid rgba(255, 255, 255, 0.8);
            animation: fadeIn 0.2s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .detail-top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }
        .detail-title {
            font-size: 16px;
            font-weight: 800;
            color: #0f172a;
        }
        .detail-badge {
            font-size: 13px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 6px;
            background: rgba(226, 232, 240, 0.8);
            color: #475569;
        }
        .detail-badge.rain {
            background: rgba(186, 230, 253, 0.9);
            color: #0369a1;
        }
        .detail-desc {
            font-size: 14.5px;
            color: #334155;
            font-weight: 600;
            line-height: 1.5;
            margin: 0;
        }

        /* 7天天气预报列表 */
        .daily-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 11px 0;
            border-bottom: 1px solid rgba(226, 232, 240, 0.6);
        }
        .daily-row:last-child { border-bottom: none; }
        .daily-left-main {
            font-size: 16px;
            font-weight: 800;
            color: #0f172a;
        }
        .daily-left-sub {
            font-size: 13.5px;
            font-weight: 600;
            color: #64748b;
            margin-top: 2px;
        }
        .daily-right {
            text-align: right;
            font-size: 15px;
            font-weight: 800;
        }

        .rain-tag-storm { color: #991b1b; } /* 暴雨 >=50mm */
        .rain-tag-heavy { color: #dc2626; } /* 大雨 >=25mm */
        .rain-tag-mid { color: #ea580c; }   /* 中雨 >=10mm */
        .rain-tag-light { color: #0284c7; } /* 小雨 >0mm */
        .rain-tag-none { color: #94a3b8; font-weight: 600; }

        /* 底部状态栏 */
        #update-time {
            text-align: center;
            font-size: 13px;
            font-weight: 600;
            color: #64748b;
            margin: 16px 0 28px;
            text-shadow: 0 1px 2px rgba(255,255,255,0.8);
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🍆 下坝村气象站</h1>
        <button class="refresh-btn" onclick="fetchData()">🔄 刷新</button>
    </div>

    <!-- 1. 未来两小时降雨雷达 -->
    <div id="radar-card" class="card">
        <div class="card-header">
            <span class="radar-title">⚡ 未来 2 小时降雨雷达</span>
            <span style="font-size:12px; font-weight:normal; color:#64748b;">5分钟级更新</span>
        </div>
        <div id="radar-text" class="radar-summary">正在获取雷达数据...</div>
    </div>

    <!-- 2. 地里实时天气 -->
    <div class="card">
        <div class="card-header">
            <span>🌡️ 地里当前实况</span>
            <span id="now-wind-badge" style="color:#0284c7; font-weight:800;">--</span>
        </div>
        <div class="temp-row">
            <span id="now-temp" class="now-temp-num">--°</span>
            <span id="now-text" class="now-weather-text">--</span>
        </div>
        <div class="meta-grid">
            <div class="meta-item">体感温度: <b id="now-feels">--℃</b></div>
            <div class="meta-item">相对湿度: <b id="now-humidity">--%</b></div>
            <div class="meta-item">风向风速: <b id="now-wind-detail">--</b></div>
            <div class="meta-item">气压指数: <b id="now-pressure">--hPa</b></div>
        </div>
    </div>

    <!-- 3. 24小时逐小时横向滑动预报 (带点击体感详解) -->
    <div class="card">
        <div class="card-header">
            <span>🕒 未来 24 小时预报</span>
            <span style="font-size:12px; font-weight:bold; color:#0284c7;">👉 点卡片看雨量说明</span>
        </div>
        <div id="hourly-scroll-wrap" class="hourly-scroll-wrap">
            <div style="padding: 20px; color: #64748b;">正在加载小时预报...</div>
        </div>
        
        <!-- 详细解释框 -->
        <div id="hourly-detail-box" class="hourly-detail-box" style="display:none;">
            <div class="detail-top-row">
                <span id="detail-title" class="detail-title">--</span>
                <span id="detail-badge" class="detail-badge">--</span>
            </div>
            <p id="detail-desc" class="detail-desc">--</p>
        </div>
    </div>

    <!-- 4. 未来七天预报 -->
    <div class="card">
        <div class="card-header">
            <span>📅 未来 7 天预报</span>
            <span style="font-size:12px; font-weight:normal; color:#64748b;">一周天气走势</span>
        </div>
        <div id="daily-list">
            <div style="padding: 10px; color: #64748b;">正在加载7天预报...</div>
        </div>
    </div>

    <div id="update-time">正在连接气象数据...</div>

    <script>
        const LOCATION = '99.0280,23.5335'; 
        const API_KEY = 'cc0137fcf6324152a477845dbe45b60d'; 
        const HOST = 'https://q45u9xuvxe.re.qweatherapi.com/v7';

        let hourlyDataStore = [];

        async function fetchEndpoint(path) {
            const res = await fetch(`${HOST}${path}&location=${LOCATION}&key=${API_KEY}`);
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const data = await res.json();
            if (data.code !== '200') throw new Error(`API Code ${data.code}`);
            return data;
        }

        // 星期转换
        function getDayLabel(dateStr, index) {
            if (index === 0) return '今天';
            if (index === 1) return '明天';
            if (index === 2) return '后天';
            const date = new Date(dateStr);
            const days = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
            return days[date.getDay()] || dateStr.substring(5);
        }

        // 紫外线指数转通俗中文
        function formatUV(uvStr) {
            const uv = parseInt(uvStr, 10);
            if (isNaN(uv)) return uvStr ? `${uvStr}级` : '中等';
            if (uv <= 2) return '弱';
            if (uv <= 4) return '中等';
            if (uv <= 6) return '较强';
            if (uv <= 9) return '很强';
            return '极强';
        }

        // 点击胶囊展示雨量体感解释
        function selectHourly(index) {
            const item = hourlyDataStore[index];
            if (!item) return;

            // 切换选中高亮
            document.querySelectorAll('.hourly-item').forEach((el, idx) => {
                el.classList.toggle('selected', idx === index);
            });

            const timeStr = index === 0 ? '现在 (' + item.fxTime.substring(11, 16) + ')' : item.fxTime.substring(11, 16);
            const precip = parseFloat(item.precip);
            const pop = item.pop || '0';

            const detailBox = document.getElementById('hourly-detail-box');
            const titleEl = document.getElementById('detail-title');
            const badgeEl = document.getElementById('detail-badge');
            const descEl = document.getElementById('detail-desc');

            detailBox.style.display = 'block';
            titleEl.innerText = `${timeStr} · ${item.text} ${item.temp}°`;

            let explanation = '';
            if (precip === 0) {
                if (item.text.includes('雨')) {
                    badgeEl.innerText = '微量雨丝';
                    badgeEl.className = 'detail-badge rain';
                    explanation = `预计这 1 小时内仅有零星小雨点或微量雨丝，降雨量几乎为 0，户外短暂停留影响不大。`;
                } else {
                    badgeEl.innerText = '无降水';
                    badgeEl.className = 'detail-badge';
                    explanation = `预计这 1 小时内无雨，地面干燥，降雨概率 ${pop}%。`;
                }
            } else if (precip < 0.5) {
                badgeEl.innerText = `${precip}毫米 (毛毛雨)`;
                badgeEl.className = 'detail-badge rain';
                explanation = `1小时降水 ${precip} 毫米：属于毛毛细雨，地面微湿，雨点很小，短时间在户外活动基本不受影响。`;
            } else if (precip < 2.5) {
                badgeEl.innerText = `${precip}毫米 (小雨)`;
                badgeEl.className = 'detail-badge rain';
                explanation = `1小时降水 ${precip} 毫米：属于明显小雨，地面会完全湿润并有浅积水，外出劳作建议撑伞或穿雨衣。`;
            } else if (precip < 8.0) {
                badgeEl.innerText = `${precip}毫米 (中雨)`;
                badgeEl.className = 'detail-badge rain';
                explanation = `1小时降水 ${precip} 毫米：属于中雨，雨声清晰、有明显积水，衣服会较快淋湿，田间道路容易泥泞。`;
            } else if (precip < 15.0) {
                badgeEl.innerText = `${precip}毫米 (大雨)`;
                badgeEl.className = 'detail-badge rain';
                explanation = `1小时降水 ${precip} 毫米：属于大雨，雨势较大、视线受限，室外劳作受阻，请在室内避雨。`;
            } else {
                badgeEl.innerText = `${precip}毫米 (短时强降雨)`;
                badgeEl.className = 'detail-badge rain';
                explanation = `1小时降水高达 ${precip} 毫米：属于短时强降雨/暴雨，雨势猛烈、极易积水，请务必注意防涝和安全防滑。`;
            }

            descEl.innerText = explanation;
        }

        async function fetchData() {
            const timeTag = document.getElementById('update-time');
            timeTag.innerText = '正在同步最新气象数据...';

            const [minResult, nowResult, hourlyResult, dailyResult] = await Promise.allSettled([
                fetchEndpoint('/minutely/5m?'),
                fetchEndpoint('/weather/now?'),
                fetchEndpoint('/weather/24h?'),
                fetchEndpoint('/weather/7d?')
            ]);

            // 1. 分钟级降雨雷达
            const radarCard = document.getElementById('radar-card');
            const radarText = document.getElementById('radar-text');
            if (minResult.status === 'fulfilled') {
                const d = minResult.value;
                radarText.innerText = d.summary || '未来两小时无明显降水';
                
                const willRain = d.minutely && d.minutely.some(item => parseFloat(item.precip) > 0.02);
                if (!willRain || d.summary.includes('无降水') || d.summary.includes('无雨') || d.summary.includes('不会下雨')) {
                    radarCard.className = 'card alert-safe';
                } else {
                    radarCard.className = 'card alert-rain';
                }
            } else {
                radarText.innerText = '短临雷达数据暂时不可用';
            }

            // 2. 地里实时天气
            if (nowResult.status === 'fulfilled') {
                const now = nowResult.value.now;
                document.getElementById('now-temp').innerText = `${now.temp}°`;
                document.getElementById('now-text').innerText = now.text;
                document.getElementById('now-wind-badge').innerText = `${now.windDir} ${now.windScale}级`;
                document.getElementById('now-feels').innerText = `${now.feelsLike}℃`;
                document.getElementById('now-humidity').innerText = `${now.humidity}%`;
                document.getElementById('now-wind-detail').innerText = `${now.windScale}级 (${now.windSpeed}km/h)`;
                document.getElementById('now-pressure').innerText = `${now.pressure}hPa`;
            } else {
                document.getElementById('now-temp').innerText = '获取失败';
            }

            // 3. 24小时逐小时预报
            if (hourlyResult.status === 'fulfilled') {
                hourlyDataStore = hourlyResult.value.hourly || [];
                let html = '';
                hourlyDataStore.forEach((item, index) => {
                    const timeStr = index === 0 ? '现在' : item.fxTime.substring(11, 16);
                    const precip = parseFloat(item.precip);
                    const isRain = precip > 0 || item.text.includes('雨');

                    let precipDisplay = '<span class="hourly-precip none">-</span>';
                    if (precip > 0) {
                        precipDisplay = `<span class="hourly-precip">${precip}mm</span>`;
                    } else if (item.text.includes('雨')) {
                        precipDisplay = '<span class="hourly-precip">微雨</span>';
                    }

                    html += `
                        <div class="hourly-item ${isRain ? 'is-rain' : ''}" onclick="selectHourly(${index})">
                            <span class="hourly-time">${timeStr}</span>
                            <span class="hourly-icon-text">${item.text}</span>
                            ${precipDisplay}
                            <span class="hourly-temp">${item.temp}°</span>
                        </div>
                    `;
                });
                document.getElementById('hourly-scroll-wrap').innerHTML = html;

                if (hourlyDataStore.length > 0) {
                    selectHourly(0);
                }
            } else {
                document.getElementById('hourly-scroll-wrap').innerHTML = '<div style="padding:15px;color:#dc2626;">小时预报加载失败</div>';
            }

            // 4. 未来 7 天预报
            if (dailyResult.status === 'fulfilled') {
                const daily = dailyResult.value.daily || [];
                let html = '';
                daily.forEach((item, idx) => {
                    const dayName = getDayLabel(item.fxDate, idx);
                    const precip = parseFloat(item.precip);
                    const uvText = formatUV(item.uvIndex);
                    let rainText = '无雨', rainClass = 'rain-tag-none';

                    if (precip >= 50.0) { 
                        rainClass = 'rain-tag-storm'; 
                        rainText = `暴雨 (${precip}mm)`; 
                    } else if (precip >= 25.0) { 
                        rainClass = 'rain-tag-heavy'; 
                        rainText = `大雨 (${precip}mm)`; 
                    } else if (precip >= 10.0) { 
                        rainClass = 'rain-tag-mid'; 
                        rainText = `中雨 (${precip}mm)`; 
                    } else if (precip > 0) { 
                        rainClass = 'rain-tag-light'; 
                        rainText = `小雨 (${precip}mm)`; 
                    }

                    html += `
                        <div class="daily-row">
                            <div>
                                <div class="daily-left-main">${dayName} · ${item.textDay}</div>
                                <div class="daily-left-sub">气温 ${item.tempMin}° ~ ${item.tempMax}° · 紫外线 ${uvText}</div>
                            </div>
                            <div class="daily-right ${rainClass}">
                                ${rainText}
                            </div>
                        </div>
                    `;
                });
                document.getElementById('daily-list').innerHTML = html;
            } else {
                document.getElementById('daily-list').innerHTML = '<div style="padding:10px;color:#dc2626;">7天预报加载失败</div>';
            }

            timeTag.innerText = `数据同步时间: ${new Date().toLocaleTimeString('zh-CN', { hour12: false })}`;
        }

        fetchData();

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                fetchData();
            }
        });

        setInterval(fetchData, 10 * 60 * 1000);
    </script>
</body>
</html>
